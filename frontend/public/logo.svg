<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- Fondo squircle oscuro (estilo app icon) -->
  <rect x="48" y="48" width="416" height="416" rx="104" fill="#232838"/>
  <!-- Calendario: anillos + cabecera + cuerpo -->
  <g>
    <!-- Anillos superiores -->
    <rect x="206" y="138" width="18" height="46" rx="9" fill="#F1F5F9"/>
    <rect x="288" y="138" width="18" height="46" rx="9" fill="#F1F5F9"/>
    <!-- Cabecera (banda) -->
    <rect x="178" y="168" width="156" height="44" rx="14" fill="#F1F5F9"/>
    <!-- Cuerpo en forma de U con base redondeada -->
    <path d="M188 238 V330 Q188 350 208 350 H304 Q324 350 324 330 V238"
      stroke="#F1F5F9" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
